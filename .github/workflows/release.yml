name: Release

# A tag v1.2.3 builds the desk, runs the tests and publishes elf-desk.zip (the quarkus-app directory) on a GitHub
# release, where house-elves install downloads it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The desk says which release it is (at the bottom of every page).
      - run: ./mvnw -B package -Dquarkus.application.version=${GITHUB_REF_NAME#v}
      - run: cd target && zip -qr ../elf-desk.zip quarkus-app
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" elf-desk.zip --title "Elf Desk $GITHUB_REF_NAME" --generate-notes
