# --- HTTP ---
# The service (prod) owns 7777, where the GitHub OAuth callback points. Dev mode uses 7481 so development
# never interrupts the running desk (signing in to dev mode needs its own OAuth App with a 7481 callback).
quarkus.http.port=7777
%dev.quarkus.http.port=7481
%dev.quarkus.http.host=0.0.0.0
%test.quarkus.http.test-port=0

# --- UI ---
# Generates the JS client + typed proxy (@quarkiverse/json-rpc-api) the Lit app imports.
quarkus.json-rpc.js-client.enabled=true
# The extension serves that client itself under /_static/, so esbuild leaves the
# imports alone and index.html's import map points the browser at it.
quarkus.web-bundler.bundling.external=@quarkiverse/json-rpc-api,@quarkiverse/json-rpc,@quarkiverse/json-rpc/*
# That client's URL never changes between deploys, so browsers must revalidate it (cheap: ETag) or they keep
# an old copy without the newest API methods ("e.prActivity is not a function").
quarkus.http.filter.jsonrpc.header."Cache-Control"=no-cache
quarkus.http.filter.jsonrpc.matches=/_static/quarkus-json-rpc.*
quarkus.http.filter.page.header."Cache-Control"=no-cache
quarkus.http.filter.page.matches=/|/index.html

# --- Sign-in: GitHub ---
# One OAuth App owned by phillip-kruger (github.com/settings/developers), with
# the callback <base>/auth/callback. Credentials come from the environment, or
# from .env in dev (never committed). This sign-in only reads: public repos need
# no scope, read:org lists your orgs. Writes (posts, closes) go through the
# runner and the machine's gh login, so the desk never holds a write token.
quarkus.oidc.provider=github
quarkus.oidc.client-id=${ELFDESK_GITHUB_CLIENT_ID:unset}
quarkus.oidc.credentials.secret=${ELFDESK_GITHUB_CLIENT_SECRET:unset}
quarkus.oidc.authentication.scopes=read:org
# GitHub is OAuth2, not OpenID Connect: no "openid" scope.
quarkus.oidc.authentication.add-openid-scope=false
quarkus.oidc.authentication.redirect-path=/auth/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
# GitHub issues no ID token, so Quarkus mints an internal one; its lifespan is
# the session's. GitHub access tokens themselves do not expire.
quarkus.oidc.authentication.internal-id-token-lifespan=12H
# The provider's default principal is the display name; the board needs the login.
quarkus.oidc.token.principal-claim=login

# Who gets in: logins on this list get the `owner` role (OwnerRoleAugmentor).
elfdesk.allowed-logins=phillip-kruger

quarkus.http.auth.permission.desk.paths=/*
quarkus.http.auth.permission.desk.policy=owner-only
quarkus.http.auth.policy.owner-only.roles-allowed=owner
quarkus.http.auth.permission.health.paths=/q/health,/q/health/*
quarkus.http.auth.permission.health.policy=permit
# The runner authenticates with its own token in its first message (RunnerHub). Messages keep the default size
# limit (the endpoint takes connections before that first message): bigger ones, like a job's answer with a large
# patch, come as parts that RunnerHub puts together only after hello, and the agent's files come in chunks.
quarkus.http.auth.permission.runner.paths=/runner
quarkus.http.auth.permission.runner.policy=permit

# --- Runner ---
# Shared secret the runner sends in its hello. Unset refuses every runner.
elfdesk.runner.token=${ELFDESK_RUNNER_TOKEN:}

# --- GitHub API ---
quarkus.rest-client.github.url=https://api.github.com
quarkus.rest-client.github.connect-timeout=5000
quarkus.rest-client.github.read-timeout=30000

# --- mvnpm-dependabot (read-only) ---
# Where that elf keeps its config (REPOS) and state.json. Defaults match the elf's own.
elfdesk.mvnpm.config=${user.home}/.config/mvnpm-dependabot/config
elfdesk.mvnpm.state-dir=${user.home}/.local/state/mvnpm-dependabot

# --- daily-triage (read-only) ---
# Where that elf saves each run (JSON, and the briefing's HTML). The desk starts runs through the runner.
elfdesk.triage.runs-dir=${user.home}/.config/daily-triage/runs

# --- weekly-status (read-only) ---
# Where that elf saves each week's draft (and records when it was sent). Send goes through the runner.
elfdesk.status.runs-dir=${user.home}/.config/weekly-status/runs

# --- quarterly-review (read-only) ---
# Where that elf saves each quarterly review. Write the review goes through the runner.
elfdesk.quarterly.runs-dir=${user.home}/.config/quarterly-review/runs

# --- Database ---
# Postgres everywhere: Dev Services in dev/test, a real instance in prod
# (QUARKUS_DATASOURCE_JDBC_URL / _USERNAME / _PASSWORD). Flyway owns the schema.
quarkus.datasource.db-kind=postgresql
# Both use the persistent elf-desk-pg container (~/.config/containers/systemd/elf-desk-pg.container): the
# service the elfdesk database, dev mode its own elfdesk_dev. Tests keep a throwaway Dev Services database.
%prod.quarkus.datasource.jdbc.url=${ELFDESK_DB_URL:jdbc:postgresql://localhost:5439/elfdesk}
%prod.quarkus.datasource.username=elfdesk
%prod.quarkus.datasource.password=${ELFDESK_DB_PASSWORD}
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5439/elfdesk_dev
%dev.quarkus.datasource.username=elfdesk
%dev.quarkus.datasource.password=${ELFDESK_DB_PASSWORD}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# Tests: don't ask for reusable Dev Services containers. ~/.testcontainers.properties enables reuse, and Ryuk
# never removes reusable containers, so each test run left a Postgres behind.
%test.quarkus.datasource.devservices.reuse=false
