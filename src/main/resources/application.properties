# --- HTTP ---
# The desk only listens on this machine (see LocalOnly). Dev mode uses 7481 so development never interrupts the
# running desk.
quarkus.http.host=127.0.0.1
quarkus.http.port=7777
%dev.quarkus.http.port=7481
%test.quarkus.http.test-port=0
# The desk's own name: its pages and sign-in cookie live only here (see LocalOnly). Browsers send *.localhost to
# 127.0.0.1 themselves. Set it to localhost for a browser that doesn't (its cookie then reaches every local port).
elfdesk.host=elf-desk.localhost
# Tests send their requests to localhost; HttpSecurityTest tests the desk's own name.
%test.elfdesk.host=localhost
# The other names a request may be addressed to (health checks, the runner): anything else is refused (DNS rebinding).
elfdesk.allowed-hosts=localhost,127.0.0.1,[::1]

# --- Where it keeps things ---
# The database, the sessions and the one-time open code. house-elves install writes the rest of the config to
# ~/.config/house-elves/desk.properties (the GitHub account and the runner token).
elfdesk.data-dir=${HOUSE_ELVES_DATA:${user.home}/.local/share/house-elves}
%dev.elfdesk.data-dir=${user.home}/.local/share/house-elves-dev
%test.elfdesk.data-dir=target/house-elves
quarkus.config.locations=${HOUSE_ELVES_CONFIG:${user.home}/.config/house-elves}/desk.properties
%test.quarkus.config.locations=

# --- UI ---
# Generates the JS client + typed proxy (@quarkiverse/json-rpc-api) the Lit app imports.
quarkus.json-rpc.js-client.enabled=true
# The extension serves that client itself under /_static/, so esbuild leaves the
# imports alone and index.html's import map points the browser at it.
quarkus.web-bundler.bundling.external=@quarkiverse/json-rpc-api,@quarkiverse/json-rpc,@quarkiverse/json-rpc/*
# That client's URL never changes between deploys, so browsers must revalidate it (cheap: ETag) or they keep
# an old copy without the newest API methods ("e.prActivity is not a function").
quarkus.http.filter.jsonrpc.header."Cache-Control"=no-cache
quarkus.http.filter.jsonrpc.matches=/_static/quarkus-json-rpc.*
quarkus.http.filter.page.header."Cache-Control"=no-cache
quarkus.http.filter.page.matches=/|/index.html
# The kit elves build their tabs with (web/kit): a second bundle, loaded by the elves' sandboxed frames, whose
# origin is opaque, so their module loads are cross-origin and need CORS (see ElfFrames). Bundles hold only code.
quarkus.web-bundler.bundle.app.dir=app
quarkus.web-bundler.bundle.kit.dir=kit
quarkus.web-bundler.bundle.kit.key=kit
quarkus.http.filter.bundle.header."Access-Control-Allow-Origin"=*
quarkus.http.filter.bundle.matches=/static/bundle/.*

# --- Sign-in ---
# No sign-in page: the desk works as one of the accounts gh is logged in to on this machine (gh's active account
# when this is empty), and you get in with a session cookie (DeskSessions, DeskSignIn).
elfdesk.github-user=
%test.elfdesk.github-user=phillip-kruger

quarkus.http.auth.permission.desk.paths=/*
quarkus.http.auth.permission.desk.policy=owner-only
quarkus.http.auth.policy.owner-only.roles-allowed=owner
quarkus.http.auth.permission.open.paths=/open,/welcome,/q/health,/q/health/*
quarkus.http.auth.permission.open.policy=permit
# What an elf's sandboxed frame loads: it can't send the cookie. Code only: the bundles, the kit, and an elf's UI
# files behind a key made when the desk starts (ElfFrames). Its data only ever comes through the desk's page.
quarkus.http.auth.permission.elf-code.paths=/static/bundle/*,/elf-kit/*,/elf-files/*
quarkus.http.auth.permission.elf-code.policy=permit
# The runner authenticates with its own token in its first message (RunnerHub). Messages keep the default size
# limit (the endpoint takes connections before that first message): bigger ones, like a job's answer with a large
# patch, come as parts that RunnerHub puts together only after hello, and the agent's files come in chunks.
quarkus.http.auth.permission.runner.paths=/runner
quarkus.http.auth.permission.runner.policy=permit

# --- Runner ---
# Shared secret the runner sends in its hello. Unset refuses every runner.
elfdesk.runner.token=

# --- GitHub API ---
quarkus.rest-client.github.url=https://api.github.com
quarkus.rest-client.github.connect-timeout=5000
quarkus.rest-client.github.read-timeout=30000

# --- mvnpm-dependabot (read-only) ---
# Where that elf keeps its config (REPOS) and state.json. Defaults match the elf's own.
elfdesk.mvnpm.config=${user.home}/.config/mvnpm-dependabot/config
elfdesk.mvnpm.state-dir=${user.home}/.local/state/mvnpm-dependabot

# --- Database ---
# H2 in a file in the data directory: nothing to run or set up. Tests use a fresh one in memory. Flyway owns the
# schema. DEFAULT_NULL_ORDERING=HIGH sorts nulls last, as Postgres did.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:${elfdesk.data-dir}/desk;DEFAULT_NULL_ORDERING=HIGH
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:desk;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
quarkus.datasource.username=desk
quarkus.datasource.password=
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
